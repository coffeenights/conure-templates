{{- if .Values.network.ports }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "webservice.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "webservice.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.network.serviceType }}
  selector:
    {{- include "webservice.selectorLabels" . | nindent 4 }}
  ports:
    {{- range .Values.network.ports }}
    - name: {{ printf "%s-%s" (.protocol | lower) (.hostPort | toString) }}
      port: {{ .hostPort | int }}
      targetPort: {{ .targetPort | int }}
      protocol: {{ .protocol }}
    {{- end }}
{{- end }}
